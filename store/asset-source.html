<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JoyhouseBot Chrome Web Store assets</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #edeaf7; }
    body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #201d2a; }
    .asset { position: relative; overflow: hidden; background: #fbf8f4; }
    .asset::before { content: ""; position: absolute; width: 720px; height: 720px; border-radius: 50%; right: -220px; top: -360px; background: radial-gradient(circle, rgba(109,94,240,.22), rgba(109,94,240,0) 68%); }
    .asset::after { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; left: -260px; bottom: -310px; background: radial-gradient(circle, rgba(239,75,145,.14), rgba(239,75,145,0) 70%); }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand img { width: 54px; height: 54px; border-radius: 14px; box-shadow: 0 14px 30px rgba(83,62,180,.23); }
    .brand b { font-size: 24px; letter-spacing: -.02em; }
    .eyebrow { color: #6d5ef0; font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 18px 0 0; font-family: Georgia, "Noto Serif SC", serif; font-size: 48px; line-height: 1.12; letter-spacing: -.035em; }
    .lead { margin-top: 17px; color: #747080; font-size: 20px; line-height: 1.6; }
    .proof { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .proof span { border: 1px solid rgba(109,94,240,.18); background: rgba(255,255,255,.78); border-radius: 999px; padding: 9px 14px; color: #5e586d; font-size: 14px; font-weight: 700; }
    .shot { position: absolute; overflow: hidden; background: #fff; border: 1px solid rgba(43,35,63,.12); box-shadow: 0 28px 70px rgba(45,34,80,.2); }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .screen { width: 1280px; height: 800px; padding: 64px 72px; }
    .screen .copy { position: relative; z-index: 2; width: 455px; }
    .screen .brand { margin-bottom: 54px; }
    .screen.capture .library { left: 535px; top: 74px; width: 600px; height: 660px; border-radius: 28px; }
    .screen.capture .library img { object-position: 22% top; }
    .screen.capture .panel { right: 60px; top: 128px; width: 310px; height: 580px; border-radius: 24px; }
    .screen.capture .panel img { object-position: center top; }
    .screen.translate .copy { width: 415px; }
    .screen.translate .translation { left: 475px; top: 70px; width: 735px; height: 660px; border-radius: 28px; }
    .screen.translate .translation img { object-position: 8% top; }

    .promo { width: 440px; height: 280px; display: grid; place-items: center; background: linear-gradient(145deg, #faf7f2 0%, #f0edff 100%); }
    .promo .promo-inner { position: relative; z-index: 2; text-align: center; }
    .promo .brand { justify-content: center; gap: 12px; }
    .promo .brand img { width: 64px; height: 64px; border-radius: 17px; }
    .promo .brand b { font-size: 29px; }
    .promo .tagline { margin-top: 20px; color: #655f73; font-size: 16px; font-weight: 700; letter-spacing: .03em; }
    .promo .orb { position: absolute; border-radius: 50%; filter: blur(.2px); opacity: .75; }
    .promo .one { width: 92px; height: 92px; left: -16px; top: -12px; background: rgba(109,94,240,.16); }
    .promo .two { width: 78px; height: 78px; right: 18px; bottom: -34px; background: rgba(239,75,145,.17); }

    .marquee { width: 1400px; height: 560px; padding: 68px 82px; }
    .marquee .copy { position: relative; z-index: 2; width: 585px; }
    .marquee h1 { font-size: 55px; }
    .marquee .panel { right: 92px; top: 45px; width: 335px; height: 650px; border-radius: 28px; transform: rotate(2deg); }
    .marquee .panel img { object-position: center top; }
    .marquee .translation { right: 350px; top: 100px; width: 480px; height: 390px; border-radius: 26px; transform: rotate(-2deg); }
    .marquee .translation img { object-position: 6% 12%; }
  </style>
</head>
<body>
  <main id="asset" class="asset screen capture">
    <section class="copy">
      <div class="brand"><img src="../icons/icon128.png" alt=""><b>JoyhouseBot</b></div>
      <div class="eyebrow">JOY · Your AI Reading Companion</div>
      <h1>把网页带回<br>你的私人书房</h1>
      <p class="lead">采集正文与图片，边读边翻译和朗读，让值得留下的内容进入长期个人系统。</p>
      <div class="proof"><span>网页采集</span><span>双语阅读</span><span>私人沉淀</span></div>
    </section>
    <div class="shot library"><img src="../../web-joyhousebot/public/images/joyhouse-library.png" alt=""></div>
    <div class="shot panel"><img src="../../web-joyhousebot/public/images/extension-sidepanel.png" alt=""></div>
  </main>
  <script>
    const kind = new URLSearchParams(location.search).get('asset') || 'capture';
    const root = document.getElementById('asset');
    if (kind === 'translate') {
      root.className = 'asset screen translate';
      root.innerHTML = `
        <section class="copy">
          <div class="brand"><img src="../icons/icon128.png" alt=""><b>JoyhouseBot</b></div>
          <div class="eyebrow">Understand in context</div>
          <h1>划词翻译，<br>双语朗读</h1>
          <p class="lead">不离开原网页查看译文，分别朗读原文与翻译，并把生词和上下文保存下来。</p>
          <div class="proof"><span>划词翻译</span><span>原文朗读</span><span>译文朗读</span></div>
        </section>
        <div class="shot translation"><img src="../../web-joyhousebot/public/images/selection-translation.png" alt=""></div>`;
    } else if (kind === 'promo') {
      root.className = 'asset promo';
      root.innerHTML = `<i class="orb one"></i><i class="orb two"></i><div class="promo-inner"><div class="brand"><img src="../icons/icon128.png" alt=""><b>JoyhouseBot</b></div><div class="tagline">READ · UNDERSTAND · REMEMBER</div></div>`;
    } else if (kind === 'marquee') {
      root.className = 'asset marquee';
      root.innerHTML = `
        <section class="copy">
          <div class="brand"><img src="../icons/icon128.png" alt=""><b>JoyhouseBot</b></div>
          <div class="eyebrow">Your AI companion for the web</div>
          <h1>从信息，到理解与行动</h1>
          <p class="lead">采集、翻译、朗读和保存，让每一次网页阅读都能回到你的 JoyHouse。</p>
        </section>
        <div class="shot translation"><img src="../../web-joyhousebot/public/images/selection-translation.png" alt=""></div>
        <div class="shot panel"><img src="../../web-joyhousebot/public/images/extension-sidepanel.png" alt=""></div>`;
    }
  </script>
</body>
</html>
